[package]
name = "vib-native"
version = "0.1.5"
edition = "2024"
publish = false
description = "The Python binding of vib_tutorial's Rust kernels (native/kernels), imported as vib_tutorial._native"
license = "MIT"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# abi3: one build serves every Python from 3.12 on.
pyo3 = { version = "0.30.1", features = ["abi3-py312"] }
numpy = "0.30.0"
vib-kernels = { path = "kernels" }

# The kernels (plain Rust) and this binding over them.
[workspace]
members = ["kernels"]

[profile.release]
codegen-units = 1
lto = "fat"
