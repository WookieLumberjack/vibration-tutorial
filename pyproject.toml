[project]
name = "vib-tutorial"
version = "0.1.4"
description = "Interactive real-time vibration tutorial: lumped mass-spring-damper chain with live modal analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { email = "30199313+WookieLumberjack@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.2",
    "scipy>=1.18.1",
]

[project.scripts]
vib-tutorial = "vib_tutorial:main"

[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

# The Rust kernels (native/) build into vib_tutorial._native; the pure-Python code in
# vib_tutorial.core stays the reference, and VIB_NATIVE=0 runs it instead.
[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "vib_tutorial._native"
features = ["pyo3/extension-module"]

# Rebuild the package (and so the kernels) on `uv sync` / `uv run` when the Rust changes.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "native/Cargo.toml" },
    { file = "native/Cargo.lock" },
    { file = "native/src/**/*.rs" },
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "mypy>=2.4.1",
    "pillow>=11.0",  # scripts/readme_screenshots.py: 256-colour PNGs
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
# Worker processes: the GUI tests' windows can't be freed (PySide's signal connections keep
# them alive), and one process building all of them grew past 8 GB of address space.
# loadgroup: the tests on conftest's `shared_window` (marked `xdist_group("shared_window")`) run on one worker,
# and every other test goes out one at a time. xdist's default `load` hands out runs of consecutive tests, so
# one worker could get every GUI smoke test and keep all their windows (see CLAUDE.md).
addopts = "-n auto --maxprocesses 4 --dist loadgroup"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "RUF"]
ignore = [
    "E501",  # long lines: the formatter wraps the code; the notes' HTML strings stay as written
    "E741",  # I (inertia), l (length): the physics' own symbols
    "N802",  # Qt's overrides: closeEvent, showEvent, ...
    "N803", "N806",  # M, K, C, A, H, ...: matrices are capitals, as in the notes
    "RUF001", "RUF002", "RUF003",  # ×, −, σ, ...: the notes and comments write the maths in Unicode
    "B905",  # zip(strict=): many zips pair arrays of one length; not yet audited
    "RUF005",  # shape + (n,), tuple + (item,): the NumPy idiom reads better than unpacking
    "RUF012",  # constant tables on Qt classes, never mutated
]

[tool.ruff.format]
quote-style = "preserve"

[tool.mypy]
python_version = "3.12"
files = ["src/vib_tutorial"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["vib_tutorial._native", "scipy.*", "pyqtgraph.*"]
ignore_missing_imports = true

# gui/ modules not clean yet: checked, but their errors not reported. Take a module off once it is.
[[tool.mypy.overrides]]
module = [
    "vib_tutorial.gui.deriving",
    "vib_tutorial.gui.modal_test",
    "vib_tutorial.gui.oma",
]
ignore_errors = true
