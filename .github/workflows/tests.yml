# The test suite on every push to main and every pull request, in two jobs side by side: `core` runs the tests
# that build no QApplication (the maths, the notes, the trials' numbers; no display or Qt system libraries
# needed), `gui` the ones that do (marked `gui` by tests/conftest.py), offscreen. The release builds run the
# whole suite again on each platform (release.yml).
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        part: [core, gui]
    name: ${{ matrix.part }}
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tags since v8

      - name: Install Qt's system libraries
        if: matrix.part == 'gui'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libxcb-shape0

      # The runners come with rustup; the package's build (maturin) compiles native/ with it.
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -m "${{ matrix.part == 'gui' && 'gui' || 'not gui' }}" --durations=10
